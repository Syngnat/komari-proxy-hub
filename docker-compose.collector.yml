name: komari-proxy-traffic-collector

services:
  collector:
    build: .
    image: komari-proxy-traffic:local
    restart: unless-stopped
    network_mode: host
    environment:
      PROXY_TRAFFIC_ROLE: collector
    volumes:
      - ./collector-config:/etc/proxy-traffic:ro
      - proxy-traffic-collector-data:/var/lib/proxy-traffic
      # Xray 模式取消下一行注释；Clash 模式不需要。
      # - /var/log/xray:/var/log/xray:ro

volumes:
  proxy-traffic-collector-data:
