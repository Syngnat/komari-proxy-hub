name: komari-proxy-hub-collector

services:
  collector:
    build: .
    image: komari-proxy-hub:local
    restart: unless-stopped
    network_mode: host
    environment:
      PROXY_HUB_ROLE: collector
    volumes:
      - ./collector-config:/etc/proxy-hub:ro
      - proxy-hub-collector-data:/var/lib/proxy-hub
      # Xray 模式取消下一行注释；Clash 模式不需要。
      # - /var/log/xray:/var/log/xray:ro

volumes:
  proxy-hub-collector-data:
